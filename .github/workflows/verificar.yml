name: Informetit - validacion de bloques
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar sintaxis
        run: npm run check
      - name: Probar bloque 01
        run: npm test
